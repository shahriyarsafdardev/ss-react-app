version: 2
jobs:
    steps:
      - checkout
     - node/install:
          install-yarn: true
      - restore_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - /home/circleci/.npm
      - run:
          name: Run Tests
          command: yarn test