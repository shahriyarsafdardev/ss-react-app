version: 2
orbs:
  node: circleci/node@4.1
jobs:
  build:
    working_directory: ~/project
    docker:
      - image: circleci/node:15
    steps:
      - checkout
      - node/install-packages:
        pkg-manager: yarn
        cache-key: "yarn.lock"
      - restore_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/project/circleci/.npm
      - run:
          name: Run Tests
          command: yarn test