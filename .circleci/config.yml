version: 2
orbs:
  node: circleci/node@4.1
jobs:
  build:
    working_directory: ~/project
    docker:
      - image: circleci/node:15
    steps:
      - checkout
      - restore_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/project/circleci/.npm
      - run:
          name: install dependecies
          command: yarn install
      - run:
          name: Run server
          command: yarn start
          background: true
  test:
    - run:
        name: Run tests
        command: yarn test
