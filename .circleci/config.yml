version: 2
jobs:
 - node/test:
    version: '15.1'
  build:
    working_directory: ~/redux-async
    docker:
      - image: circleci/node:15
    steps:
      - checkout
      - restore_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install Dependencies
          command: yarn ci
      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - /home/circleci/.npm
      - run:
          name: Run Tests
          command: yarn test