version: 2
jobs:
  build:
    working_directory: ~/project
    docker:
      - image: circleci/node:15
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn
          cache-path: ~/project/node_modules
          override-ci-command: yarn
      - restore_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - /home/circleci/.npm
      - run:
          name: Run Tests
          command: yarn test